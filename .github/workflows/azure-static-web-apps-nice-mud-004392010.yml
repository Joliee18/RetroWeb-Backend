name: Deploy RetroWeb

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RetroWeb/RetroWeb.csproj

      - name: Build app
        run: dotnet build RetroWeb/RetroWeb.csproj --configuration Release --no-restore

      - name: Publish app
        run: dotnet publish RetroWeb/RetroWeb.csproj --configuration Release --output ./publish --no-build

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: NOMBRE_REAL_DE_TU_WEBAPP
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
